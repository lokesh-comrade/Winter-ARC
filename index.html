<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Winter Arc Tracker</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --subtext: #94a3b8;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 60px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; letter-spacing: 1px; color: var(--accent); text-transform: uppercase; }
    .phase-badge { display: inline-block; background: #0369a1; padding: 4px 12px; border-radius: 12px; font-size: 0.75rem; margin-top: 6px; font-weight: bold; }
    .controls { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    select { background: #0b0f19; color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; }
    .progress-bar-container { background: #1e293b; border-radius: 8px; height: 8px; overflow: hidden; margin-top: 8px; }
    .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s ease; }
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card { background: var(--card); border: 1px solid var(--border); padding: 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .task-card.completed { border-color: var(--accent); opacity: 0.75; }
    .task-card.completed .task-label { text-decoration: line-through; color: var(--subtext); }
    .task-info { display: flex; align-items: center; gap: 12px; }
    .task-info input { width: 20px; height: 20px; accent-color: var(--accent); pointer-events: none; }
    .task-label { font-size: 0.92rem; font-weight: 500; }
    .streak-card { text-align: center; margin-top: 24px; font-size: 0.8rem; color: var(--subtext); }
  </style>
</head>
<body>

  <header>
    <h1>Winter Arc Tracker</h1>
    <div class="phase-badge" id="phaseTag">Phase 1: Foundation</div>
  </header>

  <div class="controls">
    <div>
      <div style="font-size: 0.75rem; color: var(--subtext); margin-bottom: 4px;">Select Day:</div>
      <select id="daySelect"></select>
    </div>
    <div style="text-align: right;">
      <div style="font-size: 0.75rem; color: var(--subtext);">Done</div>
      <div id="progressPercent" style="font-size: 1.1rem; font-weight: bold; color: var(--accent);">0%</div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <br/>

  <div class="task-list" id="taskList"></div>

  <div class="streak-card">
    <p>Locked in: Oct 1 – Dec 31 (92 Days)</p>
  </div>

  <script>
    // Habits aligned directly with your daily routine
    const habits = [
      "Wake up at 05:00 AM (Zero snoozing)",
      "Morning Workout (40 min session complete)",
      "Hydrate (3-4 Liters across the day)",
      "College Free Time: 45 min deep study / upskilling",
      "Commute Growth: 15 min book read or educational audio",
      "Pre-shift clean nutrition (No fast food on the road)",
      "Swiggy shift locked in (7 PM – 11 PM)",
      "In bed & phone down by 11:30 PM"
    ];

    const daySelect = document.getElementById("daySelect");
    const phaseTag = document.getElementById("phaseTag");
    const taskList = document.getElementById("taskList");
    const progressBar = document.getElementById("progressBar");
    const progressPercent = document.getElementById("progressPercent");

    // Oct 1 to Dec 31
    const dates = [];
    const curr = new Date(2026, 9, 1);
    const end = new Date(2026, 11, 31);

    while (curr <= end) {
      dates.push(new Date(curr));
      curr.setDate(curr.getDate() + 1);
    }

    dates.forEach((d, idx) => {
      const opt = document.createElement("option");
      const label = d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      opt.value = d.toISOString().split("T")[0];
      opt.textContent = `Day ${idx + 1}: ${label}`;
      daySelect.appendChild(opt);
    });

    function getStorageKey(dateStr) {
      return `winter_arc_${dateStr}`;
    }

    function renderDay(dateStr) {
      const dayIndex = dates.findIndex(d => d.toISOString().split("T")[0] === dateStr);

      if (dayIndex < 31) {
        phaseTag.textContent = "Phase 1: Foundation (Oct)";
        phaseTag.style.background = "#0369a1";
      } else if (dayIndex < 61) {
        phaseTag.textContent = "Phase 2: Overdrive (Nov)";
        phaseTag.style.background = "#4338ca";
      } else {
        phaseTag.textContent = "Phase 3: The Peak (Dec)";
        phaseTag.style.background = "#0f766e";
      }

      const savedData = JSON.parse(localStorage.getItem(getStorageKey(dateStr)) || "{}");
      taskList.innerHTML = "";
      let completedCount = 0;

      habits.forEach((habit, idx) => {
        const isChecked = !!savedData[idx];
        if (isChecked) completedCount++;

        const card = document.createElement("div");
        card.className = `task-card ${isChecked ? "completed" : ""}`;
        card.innerHTML = `
          <div class="task-info">
            <input type="checkbox" id="task-${idx}" ${isChecked ? "checked" : ""}>
            <span class="task-label">${habit}</span>
          </div>
        `;

        card.addEventListener("click", () => {
          const checkbox = card.querySelector("input");
          checkbox.checked = !checkbox.checked;
          savedData[idx] = checkbox.checked;
          localStorage.setItem(getStorageKey(dateStr), JSON.stringify(savedData));
          renderDay(dateStr);
        });

        taskList.appendChild(card);
      });

      const pct = Math.round((completedCount / habits.length) * 100);
      progressBar.style.width = pct + "%";
      progressPercent.textContent = pct + "%";
    }

    const todayStr = new Date().toISOString().split("T")[0];
    const match = dates.find(d => d.toISOString().split("T")[0] === todayStr);
    daySelect.value = match ? todayStr : dates[0].toISOString().split("T")[0];

    daySelect.addEventListener("change", (e) => renderDay(e.target.value));
    renderDay(daySelect.value);
  </script>
</body>
</html>
